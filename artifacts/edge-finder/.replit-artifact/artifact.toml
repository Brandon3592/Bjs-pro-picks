kind = "web"
previewPath = "/"
title = "EdgeFinder"
version = "1.0.0"
id = "artifacts/edge-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23705

[services.development]
run = "pnpm --filter @workspace/edge-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/edge-finder", "run", "build" ]
publicDir = "artifacts/edge-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23705"
BASE_PATH = "/"
